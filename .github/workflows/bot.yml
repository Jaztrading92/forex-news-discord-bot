name: FinancialJuice Discord Bot

on:
  workflow_dispatch:
    inputs:
      send_demo:
        description: "Envoyer un message d'exemple au demarrage"
        type: boolean
        default: false
      clean_channel:
        description: "Nettoyer le salon (supprime tous les messages) puis relancer normalement"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: financialjuice-bot
  cancel-in-progress: false

jobs:
  run-bot:
    # Version figee : ubuntu-latest change de version sans prevenir.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Pas de cache : le navigateur installe correspond toujours a la version de Playwright.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify browser launches
        run: |
          python - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  await browser.close()

          asyncio.run(main())
          print("Navigateur Chromium OK")
          EOF

      - name: Run bot (persistent ~5h30)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_ALERT_CHANNEL_ID }}
          SEND_DEMO: ${{ github.event.inputs.send_demo }}
          CLEAN_CHANNEL: ${{ github.event.inputs.clean_channel }}
        run: |
          set +e
          timeout 20400 python -u bot.py
          code=$?
          if [ "$code" -eq 124 ]; then
            echo "Arret par timeout (normal)."
            exit 0
          fi
          exit $code

      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_ALERT_CHANNEL_ID }}
        run: |
          target="${DISCORD_ALERT_CHANNEL_ID:-$DISCORD_CHANNEL_ID}"
          curl -sS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/${target}/messages" \
            -d "{\"content\":\"⚠️ **Alerte bot** : echec du run GitHub (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Nouvel essai automatique dans 10 min.\"}" || true

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.json.bak 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json.bak state.json 2>/dev/null || true
            git add state.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: update state"
            if git push origin HEAD:main; then
              break
            fi
            sleep 2
          done

      - name: Trigger next run
        if: always()
        run: |
          # Apres un echec, on attend avant de relancer pour ne pas boucler en rafale.
          if [ "${{ job.status }}" = "failure" ]; then
            sleep 600
          fi
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}'
