name: FinancialJuice Discord Bot

on:
  workflow_dispatch:
    inputs:
      send_demo:
        description: "Envoyer un message d'exemple au demarrage"
        type: boolean
        default: false
      clean_channel:
        description: "Nettoyer le salon (supprime tous les messages) puis relancer normalement"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: financialjuice-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Run bot (persistent ~5h30)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SEND_DEMO: ${{ github.event.inputs.send_demo }}
          CLEAN_CHANNEL: ${{ github.event.inputs.clean_channel }}
        run: timeout 20400 python -u bot.py || true

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.json.bak 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json.bak state.json 2>/dev/null || true
            git add state.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: update state"
            if git push origin HEAD:main; then
              break
            fi
            sleep 2
          done

      - name: Trigger next run
        if: false
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}'
