name: Daily Economic Digest

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Forcer l'envoi immediat des annonces de demain (ignore l'heure)"
        type: boolean
        default: false
      dry_run:
        description: "Mode test : afficher le message dans le journal sans l'envoyer"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    # Version figee : ubuntu-latest change de version sans prevenir.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check if it is 23h (or catch-up until 4h) in Paris
        id: check_time
        run: |
          HOUR=$(TZ=Europe/Paris date +%H)
          echo "Heure actuelle a Paris: $HOUR"
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force_send }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "$HOUR" = "23" ] || { [ "$HOUR" -ge 0 ] && [ "$HOUR" -le 3 ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.check_time.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements-digest.txt

      - name: Run daily digest
        if: steps.check_time.outputs.should_run == 'true'
        env:
          FOREXFACTORY_WEBHOOK_URL: ${{ secrets.FOREXFACTORY_WEBHOOK_URL }}
          FORCE_SEND: ${{ github.event.inputs.force_send == 'true' || github.event.inputs.dry_run == 'true' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python daily_digest.py

      - name: Commit dedup marker
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add digest_last_sent.txt 2>/dev/null || true
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: update digest dedup marker"
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            sleep 2
          done

      # Les echecs avant 3h sont rattrapes au passage suivant (toutes les 10 min) ;
      # a 3h c'est le dernier rattrapage de la nuit, donc on previent.
      - name: Alert Discord on failure
        if: failure() && (steps.check_time.outputs.hour == '03' || github.event.inputs.force_send == 'true')
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_ALERT_CHANNEL_ID }}
        run: |
          target="${DISCORD_ALERT_CHANNEL_ID:-$DISCORD_CHANNEL_ID}"
          curl -sS -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/${target}/messages" \
            -d "{\"content\":\"⚠️ **Alerte annonces** : les annonces economiques n'ont pas pu etre envoyees (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).\"}" || true
