name: Daily Economic Digest

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Forcer l'envoi immediat (ignore la verification de l'heure)"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-digest.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements-digest.txt') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Run daily digest
        env:
          FOREXFACTORY_WEBHOOK_URL: ${{ secrets.FOREXFACTORY_WEBHOOK_URL }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: python daily_digest.py
